name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref — several contributors push here.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # GATING JOB — must pass. These are the runtimes package.json supports
  # (`engines.node >= 22.19`), and both have native zstd, so every test runs for
  # real and the write path is genuinely exercised.
  # ───────────────────────────────────────────────────────────────────────────
  test-supported:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.15 is the first release with zlib.zstdCompressSync, required to
        # write sessions in DSH's format. 24 covers a newer major.
        node: ['22.15', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Assert the runtime really has native zstd
        # HARD FAIL, not a skip. Writing sessions requires zstd; if this runtime
        # silently lacked it, a fallback would be exercised and the suite would
        # quietly verify less. Pin the assumption so it cannot drift.
        run: |
          node --version
          node -e "
            const z = require('node:zlib');
            const hasZstd = typeof z.zstdCompressSync === 'function'
              && typeof z.zstdDecompressSync === 'function';
            console.log('native zstd:', hasZstd);
            if (!hasZstd) {
              console.error('::error::This job requires native zstd (Node >= 22.15). ' +
                'Without it the write path cannot be exercised. Current: ' + process.version);
              process.exit(1);
            }
          "

      - name: Configure git identity
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
          # Mirrors a real machine posture (and the environment that exposed the
          # commit-tree identity bug): no implicit identity lookup.
          git config --global user.useconfigonly true

      - name: Privacy scan
        # Public repository: fail before any test output could echo user paths.
        run: ./scripts/check-private.sh

      - name: Run tests
        run: node --test "test/**/*.test.js"

      - name: Enforce zero skipped tests
        # A skipped test verifies nothing while making the report look green.
        # On supported runtimes there is no legitimate reason to skip.
        run: |
          set -o pipefail
          node --test "test/**/*.test.js" 2>&1 | tee /tmp/out.txt
          if grep -qE '^ℹ skipped [1-9]|^# skipped [1-9]' /tmp/out.txt; then
            echo "::error::At least one test was skipped on a supported runtime."
            grep -iE 'skip' /tmp/out.txt || true
            exit 1
          fi
          echo "no skipped tests"

  # ───────────────────────────────────────────────────────────────────────────
  # KNOWN-LIMITATION JOB — allowed to fail, isolated so it cannot mask a real
  # regression in the gating job above.
  #
  # WHY: Node < 22.15 has no zstd compressor. The engine deliberately REFUSES to
  # write a session rather than emit a file DSH cannot read, so tests that go
  # through the real write path cannot pass there. The e2e suites inject a
  # zero-dependency frame encoder so most still run, but this job stays
  # informational: it reports the legacy story without pretending all is well.
  # ───────────────────────────────────────────────────────────────────────────
  test-legacy-node:
    name: test (node ${{ matrix.node }}) — informational, may fail
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: ['20.x']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Explain the known limitation up front
        run: |
          cat <<'MSG'
          ======================================================================
          KNOWN LIMITATION — this job is INFORMATIONAL and is allowed to fail.

          Node < 22.15 has no zlib zstd compressor. This package declares
          engines.node >= 22.19 and needs zstd to WRITE session files: the format
          must be zstd frames or DSH itself cannot read them back.

          If this job is red, check whether the failures are:
            * "没有 zstd 压缩能力" / "requires native zstd"  -> expected
            * anything else                                   -> investigate,
              but the gating test-supported job is authoritative.

          Do NOT "fix" this job by adding t.skip() — a skip hides the limitation
          instead of reporting it.
          ======================================================================
          MSG

      - name: Configure git
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Run tests (informational)
        run: node --test
        continue-on-error: true

      - name: Summarise the legacy-runtime result
        if: always()
        run: |
          set +e
          node --test > /tmp/legacy.txt 2>&1
          {
            echo "### node ${{ matrix.node }} (unsupported, informational)"
            echo '```'
            grep -E '^ℹ (tests|pass|fail|skipped)|^# (tests|pass|fail|skipped)' /tmp/legacy.txt || true
            grep -E '^✖ |^not ok ' /tmp/legacy.txt | head -20 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────────
  # Independent privacy gate — a second opinion, not a copy of the scan inside
  # the test job (which a source change could weaken).
  # ───────────────────────────────────────────────────────────────────────────
  privacy:
    name: privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for machine-specific data
        run: |
          ./scripts/check-private.sh

          echo "--- independent checks ---"
          if git ls-files -z | xargs -0 grep -nIE '/Users/[a-z0-9_.-]+/(Documents|Github|Work|\.dsh)' 2>/dev/null \
             | grep -v 'scripts/check-private.sh'; then
            echo "::error::A real home directory leaked into a tracked file."
            exit 1
          fi

          if git ls-files -z \
             | xargs -0 grep -nIE 'session-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' 2>/dev/null \
             | grep -vE '^(test/|docs/|scripts/check-private\.sh)' \
             | grep -vE 'session-0{8}-0{4}-[0-9a-f]{4}-[0-9a-f]{4}-0{12}'; then
            echo "::error::A non-synthetic session id appears outside test/ and docs/."
            exit 1
          fi
          echo "privacy checks passed"
