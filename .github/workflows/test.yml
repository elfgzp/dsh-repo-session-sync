name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref — this repo has several agents pushing.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Two runtimes on purpose:
        #  - 20 has NO zlib.zstdDecompressSync, so it exercises the pure-JS
        #    frame decoding path. Without this the matrix would silently never
        #    test that code.
        #  - 22 is the minimum the package declares (engines >= 22.19) and does
        #    have the native zstd API.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Show environment
        run: |
          node --version
          git --version
          node -e "console.log('native zstd:', typeof require('node:zlib').zstdDecompressSync)"

      - name: Configure git identity
        # The transport tests create real repositories and commits. CI runners
        # have no user.name/user.email, so set one here rather than letting git
        # fail (or prompt) inside a test.
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main

      - name: Privacy scan (must pass before anything else)
        # This repository is public. Failing fast here means a leaked path or
        # credential never reaches the test output or an artifact.
        run: ./scripts/check-private.sh

      - name: Run test suite
        # Explicit glob: works on Node 22+. On Node 20 `--test` does not expand
        # globs, so fall back to the bare form, which both versions support.
        run: |
          if [ "${{ matrix.node }}" = "20" ]; then
            node --test
          else
            node --test "test/**/*.test.js"
          fi

      - name: Assert zero skipped tests
        # A skipped test looks green while verifying nothing. On CI we require
        # that every test actually ran.
        run: |
          set -o pipefail
          if [ "${{ matrix.node }}" = "20" ]; then
            node --test 2>&1 | tee /tmp/test-output.txt
          else
            node --test "test/**/*.test.js" 2>&1 | tee /tmp/test-output.txt
          fi
          echo "--- summary ---"
          if grep -qE '^# skipped [1-9]|^ℹ skipped [1-9]' /tmp/test-output.txt; then
            echo "::error::At least one test was skipped — skipped tests verify nothing."
            grep -E '^not ok .*# SKIP|SKIP' /tmp/test-output.txt || true
            exit 1
          fi
          echo "no skipped tests"

  privacy:
    name: privacy guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan repository for machine-specific data
        run: |
          ./scripts/check-private.sh
          echo "--- explicit checks ---"
          # Real home directories must never appear in tracked files.
          if git ls-files -z | xargs -0 grep -nIE '/Users/[a-z0-9_.-]+/(Documents|Github|Work|\.dsh)' 2>/dev/null \
             | grep -v 'scripts/check-private.sh'; then
            echo "::error::A real home directory leaked into a tracked file."
            exit 1
          fi
          # Fixtures must be synthetic: no real-looking session ids outside tests
          # that are explicitly documents/examples. The reference checker already
          # covers this; this is a second, independent opinion.
          echo "privacy checks passed"
