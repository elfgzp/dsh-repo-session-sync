<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Repository Session Sync">
  <!--
    Two machines exchanging a conversation log, joined by a git branch.

    The shape is deliberately simple and monochrome-friendly: at 20px in a
    settings nav the branch line and the two nodes are what remain legible.
  -->
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- left machine -->
    <rect x="4" y="16" width="18" height="14" rx="3" />
    <path d="M9 35h8" />
    <!-- right machine -->
    <rect x="42" y="16" width="18" height="14" rx="3" />
    <path d="M47 35h8" />
    <!-- branch line with commit nodes -->
    <path d="M22 23h20" />
    <circle cx="32" cy="23" r="3.5" fill="currentColor" stroke="none" />
    <!-- conversation log travelling along the branch -->
    <path d="M24 46h16" />
    <path d="M28 52h8" />
    <path d="M32 37v6" />
  </g>
</svg>
